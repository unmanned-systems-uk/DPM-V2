name: Compression Detection

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  detect-compression:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - name: Detect potential context compression
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // Compression indicators
          const compressionIndicators = [
            'lost context',
            'forgot',
            'remember the rules',
            'what was i doing',
            'what domain am i',
            'compression',
            'context lost',
            'start over',
            'confused about'
          ];

          // WHO tag patterns that might indicate Claude Code
          const ccPatterns = [
            'CC-Air-Side',
            'CC-Ground-Side',
            'CC-Dev-Tools',
            'CC-Project-Manager'
          ];

          let comment;
          let issueNumber;

          if (context.eventName === 'issue_comment') {
            comment = context.payload.comment.body.toLowerCase();
            issueNumber = context.payload.issue.number;
          } else if (context.eventName === 'pull_request_review_comment') {
            comment = context.payload.comment.body.toLowerCase();
            issueNumber = context.payload.pull_request.number;
          } else {
            return;
          }

          // Check if comment is from Claude Code
          const isFromCC = ccPatterns.some(pattern =>
            context.payload.comment.body.includes(pattern)
          );

          if (!isFromCC) {
            return; // Only check Claude Code comments
          }

          // Check for compression indicators
          const hasCompressionIndicator = compressionIndicators.some(indicator =>
            comment.includes(indicator)
          );

          // Check for missing WHO tag (sign of compression)
          const hasWhoTag = context.payload.comment.body.startsWith('**WHO:**');

          if (hasCompressionIndicator || !hasWhoTag) {
            console.log('Potential compression detected!');

            // Add helpful recovery comment
            const recoveryComment = `**WHO:** GitHub Actions Bot

**WARNING: Potential Context Compression Detected**

It appears the Claude Code session may have experienced context compression.

**Quick Recovery Steps:**
1. Read \`.claude/COMPRESSION_EMERGENCY.md\` (50 lines)
2. Read \`.claude/RULES_CRITICAL.md\` (100 lines)
3. Check open issues: \`gh issue list --state open\`

**Critical Rules Reminder:**
1. NEVER close GitHub issues (user closes)
2. ALWAYS search history before implementing
3. WHO tags MANDATORY on every comment
4. NEVER work without GitHub issue
5. NEVER modify other domain's code without approval

**Full Context Recovery:**
\`\`\`bash
cat .claude/SESSION_START.md
cat docs/CC_READ_THIS_FIRST.md
\`\`\`

---
*This automated message helps recover from context compression.*`;

            // Post recovery help
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: recoveryComment
            });

            // Add label to track compression events
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['compression-detected']
            });

            console.log(`Posted recovery help to issue #${issueNumber}`);
          }

  track-session-length:
    runs-on: ubuntu-latest
    permissions:
      issues: read

    steps:
    - name: Monitor session length
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          // Only process Claude Code comments
          if (!context.payload.comment.body.includes('**WHO:** CC-')) {
            return;
          }

          const issueNumber = context.payload.issue.number;

          // Get all comments on this issue
          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: issueNumber
          });

          // Count Claude Code comments in this session
          const ccComments = comments.data.filter(c =>
            c.body.includes('**WHO:** CC-')
          );

          const commentCount = ccComments.length;

          // Warn at 40+ comments (approaching compression)
          if (commentCount > 40 && commentCount % 10 === 0) {
            console.log(`Session has ${commentCount} CC comments - approaching compression threshold`);

            // Calculate time span
            const firstComment = new Date(ccComments[0].created_at);
            const lastComment = new Date(ccComments[ccComments.length - 1].created_at);
            const sessionHours = (lastComment - firstComment) / (1000 * 60 * 60);

            if (sessionHours > 2) {
              console.log(`Long session detected: ${sessionHours.toFixed(1)} hours`);

              // Create metrics for future analysis
              core.setOutput('session_length', commentCount);
              core.setOutput('session_hours', sessionHours);
              core.setOutput('compression_risk', commentCount > 50 ? 'high' : 'medium');
            }
          }